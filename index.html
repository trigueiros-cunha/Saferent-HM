<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiffSpace — Plataforma de Gestão</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
--bg:#04040a;--bg2:#080810;--bgH:#0c0e18;--bgM:#0a0c16;--bgSb:#06060e;
--bgHd:rgba(4,4,10,.94);--bgIn:#0a0a14;--bgTab:#1e293b;
--bd:#0f1420;--bdL:#141420;--bdH:#1e293b;--bdIn:#1e293b;
--tx:#e2e8f0;--txS:#94a3b8;--txM:#64748b;--txF:#475569;--txG:#334155;
--grn:#22c55e;--ylw:#f59e0b;--red:#ef4444;--blu:#3b82f6;--pur:#8b5cf6;--cyn:#06b6d4;--pk:#ec4899;
--sh:rgba(0,0,0,.15);--shM:rgba(0,0,0,.25);
--mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;--head:'Syne',sans-serif;
}
[data-theme="light"]{
--bg:#f7f8fb;--bg2:#fff;--bgH:#f1f5f9;--bgM:#f4f6fa;--bgSb:#06060e;
--bgHd:rgba(247,248,251,.96);--bgIn:#fff;--bgTab:#e2e8f0;
--bd:#e2e8f0;--bdL:#edf0f4;--bdH:#cbd5e1;--bdIn:#cbd5e1;
--tx:#0f172a;--txS:#475569;--txM:#64748b;--txF:#94a3b8;--txG:#b0bec5;
--sh:rgba(0,0,0,.04);--shM:rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;transition:background .4s,color .4s}

.sb{width:220px;background:var(--bgSb);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sb-logo{padding:16px 16px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--blu),var(--cyn));display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--head);font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.sb-logo span{font-family:var(--head);font-size:16px;font-weight:700;color:#fff;letter-spacing:-.5px}
.sb-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.4);font-size:13px;font-weight:400;border:none;background:transparent;width:100%;text-align:left;font-family:var(--sans)}
.nb:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7)}
.nb.on{color:#fff;font-weight:600}
.nb .ic{font-size:16px;width:22px;text-align:center;flex-shrink:0;font-style:normal}
.nb .desc{font-size:10px;color:rgba(255,255,255,.2)}
.nb.on .desc{color:rgba(255,255,255,.3)}
.sb-ft{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06)}
.sb-ft .nb{font-size:12px;padding:8px 12px;color:rgba(255,255,255,.3)}

.mn{margin-left:220px;flex:1;min-height:100vh}
.topbar{padding:12px 28px;border-bottom:1px solid var(--bd);background:var(--bgHd);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.ct{padding:24px 28px;max-width:1100px}

.vw{display:none;animation:fi .35s ease}.vw.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px 14px;position:relative;overflow:hidden;transition:all .3s}
.stat .sl{font-size:10px;color:var(--txF);font-family:var(--mono);letter-spacing:.5px;margin-bottom:6px}
.stat .sv{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1}
.stat .si{position:absolute;top:12px;right:14px;font-size:20px;opacity:.12;font-style:normal}
.stat .ss{font-size:11px;color:var(--txG);margin-top:4px}

.bg{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono);white-space:nowrap;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.cd{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;transition:all .2s}
.cd:hover{border-color:var(--bdH)}
.cdc{cursor:pointer}.cdc:hover{background:var(--bgH)}

.fb{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--mono);border:1px solid var(--bdL);background:transparent;color:var(--txF);transition:all .2s}
.fb:hover{border-color:var(--bdH);color:var(--tx)}

.mcard{background:var(--bgM);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--shM)}
.mcard .circle{position:absolute;top:-10px;right:-10px;width:60px;height:60px;border-radius:50%}

.sect{font-size:11px;color:var(--txS);font-family:var(--mono);letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}

.alrt{flex:1;min-width:200px;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s}
.alrt:hover{transform:translateY(-1px)}

.inp{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--bdIn);background:var(--bgIn);color:var(--tx);font-size:13px;font-family:var(--sans);outline:none;box-sizing:border-box}
.inp:focus{border-color:var(--blu)}

@media(max-width:768px){
.sb{width:60px}.sb-logo span,.nb span:not(.ic),.nb .desc{display:none}.nb{justify-content:center;padding:11px}
.mn{margin-left:60px}.ct{padding:16px}.sb-logo{justify-content:center;padding:16px}
}
</style>
</head>

];

const SEM={green:{color:"#22c55e",label:"Pronto e OK",icon:"✓"},yellow:{color:"#f59e0b",label:"Com Observações",icon:"!"},red:{color:"#ef4444",label:"Não Habitável",icon:"⚠"}};

/* ═══ MODULES NAV ═══ */
const MODS=[
{key:"overview",label:"Visão Geral",icon:"◐",color:"#06b6d4"},
{key:"properties",label:"Propriedades",icon:"🏠",color:"#3b82f6"},
{key:"diffscan",label:"DiffScan",icon:"🔍",color:"#8b5cf6",desc:"Inspeções"},
{key:"cleancheck",label:"CleanCheck",icon:"🚦",color:"#22c55e",desc:"Limpeza"},
{key:"maintenance",label:"Manutenção",icon:"🔧",color:"#f59e0b",desc:"Reparações"},
{key:"team",label:"Equipa",icon:"👥",color:"#ec4899",desc:"Permissões"},
];

let curMod="overview",ccFilter="all",ccExpanded=null,mFilter="all",mExpanded=null,scFilter="all",qrItems=[];

/* ═══ THEME ═══ */
function getTheme(){return localStorage.getItem("ds-th")||"dark"}
function setTheme(t){document.documentElement.setAttribute("data-theme",t==="light"?"light":"");localStorage.setItem("ds-th",t);document.getElementById("thIc").textContent=t==="dark"?"☀":"☾";document.getElementById("thLb").textContent=t==="dark"?"Modo claro":"Modo escuro"}
function toggleTheme(){setTheme(getTheme()==="dark"?"light":"dark")}

/* ═══ HELPERS ═══ */
function badge(c,l){return '<span class="bg" style="background:'+c+'15;color:'+c+';border:1px solid '+c+'30">'+l+'</span>'}
function stat(l,v,c,ic,sub){return '<div class="stat"><div class="sl">'+l+'</div><div class="sv" style="color:'+c+'">'+v+'</div><div class="si">'+ic+'</div>'+(sub?'<div class="ss">'+sub+'</div>':'')+'</div>'}

/* ═══ NAV ═══ */
function buildNav(){
  document.getElementById("navBtns").innerHTML=MODS.map(m=>'<button class="nb'+(curMod===m.key?" on":"")+'" onclick="nav(''+m.key+'')" style="'+(curMod===m.key?"background:"+m.color+"15":"")+'"><span class="ic">'+m.icon+'</span><span style="'+(curMod===m.key?"color:"+m.color:"")+'">'+ m.label+'</span>'+(m.desc?'<span class="desc">'+m.desc+'</span>':'')+'</button>').join("");
}
function nav(key){
  curMod=key;buildNav();
  document.querySelectorAll(".vw").forEach(v=>v.classList.remove("on"));
  document.getElementById("v"+key.charAt(0).toUpperCase()+key.slice(1)).classList.add("on");
  const m=MODS.find(x=>x.key===key);
  document.getElementById("topTitle").textContent=(m?m.icon+" "+m.label:"");
  render();
}

/* ═══ FIREBASE ═══ */
async function fbGetAll(){if(!db)return[];try{const s=await db.ref("properties").once("value");return s.val()?Object.values(s.val()):[];}catch(e){return[]}}
function fbListen(){if(!db)return;db.ref("properties").on("value",()=>{if(curMod==="cleancheck"||curMod==="overview")render()})}

/* ═══ RENDER ═══ */
async function render(){
  if(curMod==="overview") await renderOverview();
  else if(curMod==="properties") renderProperties();
  else if(curMod==="diffscan") renderDiffScan();
  else if(curMod==="cleancheck") await renderCleanCheck();
  else if(curMod==="maintenance") renderMaintenance();
  else if(curMod==="team") renderTeam();
}

/* ═══ OVERVIEW ═══ */
async function renderOverview(){
  const el=document.getElementById("vOverview");
  const fb=await fbGetAll();
  const h=new Date().getHours();
  const greet=h<12?"Bom dia":h<19?"Boa tarde":"Boa noite";
  const dateStr=new Date().toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const occ=PROPS.filter(p=>p.status==="occupied"||p.status==="checkout_today").length;
  const co=PROPS.filter(p=>p.status==="checkout_today").length;
  const openM=MAINTS.filter(m=>m.status!=="completed").length;
  const flagged=SCANS.filter(r=>r.status==="flagged").length;
  const pending=fb.filter(c=>!c.status||c.status==="pending").length;
  const fbRed=fb.filter(c=>c.status==="red").length;
  const avg=Math.round(PROPS.reduce((a,p)=>a+p.score,0)/PROPS.length);
  const totalMaintCost=MAINTS.filter(m=>m.status!=="completed").reduce((a,m)=>a+(m.techEst||m.sugCost||0),0);

  let alerts="";
  if(co>0)alerts+='<div class="alrt" style="background:#f59e0b10;border:1px solid #f59e0b30" onclick="nav(\'properties\')"><span style="font-size:20px">◐</span><div><div style="font-size:13px;font-weight:600;color:var(--ylw)">'+co+' check-out'+(co>1?'s':'')+' hoje</div><div style="font-size:11px;color:var(--txF)">Limpeza e inspeção necessárias</div></div></div>';
  if(flagged>0)alerts+='<div class="alrt" style="background:#ef444410;border:1px solid #ef444430" onclick="nav(\'diffscan\')"><span style="font-size:20px">⚠</span><div><div style="font-size:13px;font-weight:600;color:var(--red)">'+flagged+' danos graves por resolver</div><div style="font-size:11px;color:var(--txF)">Requer ação imediata</div></div></div>';
  if(fbRed>0)alerts+='<div class="alrt" style="background:#ef444410;border:1px solid #ef444430" onclick="nav(\'cleancheck\')"><span style="font-size:20px">🚦</span><div><div style="font-size:13px;font-weight:600;color:var(--red)">'+fbRed+' alerta'+(fbRed>1?'s':'')+' CleanCheck</div><div style="font-size:11px;color:var(--txF)">Apartamentos não habitáveis</div></div></div>';

  el.innerHTML='<h1 style="font-family:var(--head);font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.5px">'+greet+', João 👋</h1><p style="font-size:14px;color:var(--txF);margin:0 0 24px">'+dateStr+'</p>'
  +(alerts?'<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">'+alerts+'</div>':"")
  +'<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:28px">'
  +stat("Propriedades",PROPS.length,"#3b82f6","🏠")
  +stat("Ocupadas",occ,"#22c55e","●")
  +stat("Score médio",avg,avg>=90?"#22c55e":"#f59e0b","◐")
  +stat("CleanCheck",fb.length,"#22c55e","🚦")
  +stat("Danos graves",flagged,flagged>0?"#ef4444":"#22c55e","🔍")
  +stat("Manutenções",openM,"#f59e0b","🔧")
  +'</div>'
  +'<div class="sect">Módulos</div>'
  +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px">'
  +[{key:"diffscan",icon:"🔍",title:"DiffScan",sub:"Inspeções fotográficas",st:(SCANS.filter(r=>r.status==="pending"||r.status==="flagged").length)+" pendentes",color:"#8b5cf6"},
    {key:"cleancheck",icon:"🚦",title:"CleanCheck",sub:"Semáforos de limpeza",st:fbRed+" alertas · "+fb.filter(c=>c.status==="green").length+" OK",color:"#22c55e"},
    {key:"maintenance",icon:"🔧",title:"Manutenção",sub:"Ordens de reparação",st:openM+" abertas · "+totalMaintCost+"€ est.",color:"#f59e0b"},
  ].map(m=>'<div class="mcard" onclick="nav(''+m.key+'')" onmouseover="this.style.borderColor=''+m.color+'50'" onmouseout="this.style.borderColor='var(--bd)'"><div style="font-size:28px;margin-bottom:10px">'+m.icon+'</div><div style="font-size:16px;font-weight:600;margin-bottom:2px">'+m.title+'</div><div style="font-size:12px;color:var(--txM);margin-bottom:10px">'+m.sub+'</div><div style="font-size:12px;font-family:var(--mono);color:'+m.color+';font-weight:600">'+m.st+'</div><div class="circle" style="background:'+m.color+'08"></div></div>').join("")
  +'</div>'
  +'<div class="sect">Pipeline de hoje</div>'
  +'<div style="display:flex;flex-direction:column;gap:8px">'

function renderQRPanel(){
  const el=document.getElementById("qrPanel");
  let h='<div class="cd" style="margin-bottom:12px"><div style="font-size:14px;font-weight:600;margin-bottom:12px">Gerar QR Codes</div><div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:600;color:var(--txS);margin-bottom:5px;font-family:var(--mono)">URL BASE</label><input id="qrBase" class="inp" value="https://trigueiros-cunha.github.io/Saferent-HM/cleancheck.html"><div style="font-size:10px;color:var(--txG);margin-top:4px">O QR abrirá: URL?apt=NomeDoApartamento</div></div><div style="display:flex;gap:10px"><input id="qrName" class="inp" placeholder="Nome do apartamento (ex: APT-101)" onkeydown="if(event.key==='Enter')addQR()" style="flex:1"><button onclick="addQR()" style="padding:10px 20px;border-radius:10px;border:none;background:#22c55e;color:#0f172a;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--head);white-space:nowrap">+ Adicionar</button></div></div>';
  if(qrItems.length){
    h+='<div class="cd"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="font-size:14px;font-weight:600">'+qrItems.length+' QR Code'+(qrItems.length>1?"s":"")+'</span><button onclick="dlAllQR()" style="padding:7px 14px;border-radius:8px;border:none;background:var(--bgTab);color:var(--tx);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono)">📥 Download todos</button></div><div id="qrCards"></div></div>';
  }
  el.innerHTML=h;
  if(qrItems.length){
    const cc=document.getElementById("qrCards");
    qrItems.forEach((q,i)=>{
      const card=document.createElement("div");card.style.cssText="display:flex;align-items:center;gap:16px;padding:12px 0;"+(i<qrItems.length-1?"border-bottom:1px solid var(--bdL)":"");
      const qb=document.createElement("div");qb.id="qrc-"+i;qb.style.cssText="background:#fff;padding:6px;border-radius:8px;flex-shrink:0";
      const info=document.createElement("div");info.style.cssText="flex:1;overflow:hidden";info.innerHTML='<div style="font-size:15px;font-weight:700;margin-bottom:3px">'+q.name+'</div><div style="font-size:10px;color:var(--txG);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+q.url+'</div>';
      const acts=document.createElement("div");acts.style.cssText="display:flex;flex-direction:column;gap:6px;flex-shrink:0";
      acts.innerHTML='<button onclick="dlQR('+i+',\''+q.name.replace(/'/g,"\\'")+'\',event)" style="padding:6px 14px;border-radius:8px;border:none;background:#22c55e;color:#0f172a;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono)">📥 Download</button><button onclick="rmQR('+i+',event)" style="padding:6px 14px;border-radius:8px;border:1px solid var(--bdL);background:transparent;color:var(--txM);font-size:11px;cursor:pointer;font-family:var(--mono)">✕ Remover</button>';
      card.appendChild(qb);card.appendChild(info);card.appendChild(acts);cc.appendChild(card);
      try{new QRCode(qb,{text:q.url,width:100,height:100,colorDark:"#0f172a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H})}catch(e){}
    });
  }
}
function addQR(){
  const n=document.getElementById("qrName").value.trim(),b=document.getElementById("qrBase").value.trim();
  if(!n){alert("Insira o nome");return}if(!b){alert("Insira o URL");return}
  if(qrItems.find(q=>q.name===n)){alert("Já existe");return}
  qrItems.push({name:n,url:b+"?apt="+encodeURIComponent(n)});
  document.getElementById("qrName").value="";renderQRPanel();
}
function rmQR(i,e){e&&e.stopPropagation();qrItems.splice(i,1);renderQRPanel()}
function dlQR(i,name,e){e&&e.stopPropagation();const el=document.querySelector("#qrc-"+i);if(!el)return;const cv=el.querySelector("canvas"),im=el.querySelector("img");const a=document.createElement("a");a.download="QR-"+name+".png";if(cv)a.href=cv.toDataURL("image/png");else if(im)a.href=im.src;else return;a.click()}
function dlAllQR(){qrItems.forEach((q,i)=>setTimeout(()=>dlQR(i,q.name),i*400))}

async function exportCSV(){

  all.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  let csv="\uFEFFData,Hora,Apartamento,Estado,Observações\n";
  all.forEach(p=>{const d=new Date(p.timestamp);csv+=d.toLocaleDateString("pt-PT")+","+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})+","+p.code+","+(SEM[p.status]?SEM[p.status].label:p.status)+",\""+((p.notes||"").replace(/"/g,'""'))+"\"\n"});
  const a=document.createElement("a");a.download="CleanCheck_"+new Date().toISOString().split("T")[0]+".csv";a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.click();

  +USERS.map(u=>{
    const r=ROLES[u.role];
    return '<div class="cd"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:14px"><div style="width:42px;height:42px;border-radius:50%;background:'+r.color+'15;border:2px solid '+r.color+'30;display:flex;align-items:center;justify-content:center;font-size:18px">'+u.avatar+'</div><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:2px"><span style="font-size:14px;font-weight:600">'+u.name+'</span>'+badge(r.color,r.icon+" "+r.label)+'</div><div style="font-size:11px;color:var(--txF);font-family:var(--mono)">'+u.email+'</div></div></div><div style="text-align:right"><div style="font-size:11px;color:var(--txM);margin-bottom:2px">Acesso:</div><div style="font-size:12px;font-weight:600;color:'+r.color+'">'+r.access+'</div></div></div></div>';
  }).join("")+'</div>';
}

/* ═══ INIT ═══ */
setTheme(getTheme());
buildNav();
render();
fbListen();
</script>
</body>
