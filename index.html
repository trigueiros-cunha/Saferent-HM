:root{--bg:#04040a;--bg2:#080810;--bgH:#0c0e18;--bgM:#0a0c16;--bgHd:rgba(4,4,10,.94);--bgIn:#0a0a14;--bgTab:#1e293b;--bd:#0f1420;--bdL:#141420;--bdH:#1e293b;--tx:#e2e8f0;--txS:#94a3b8;--txM:#64748b;--txF:#475569;--txG:#334155;--grn:#22c55e;--ylw:#f59e0b;--red:#ef4444;--blu:#3b82f6;--pur:#8b5cf6;--cyn:#06b6d4;--mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;--head:'Syne',sans-serif}
[data-theme="light"]{--bg:#f7f8fb;--bg2:#fff;--bgH:#f1f5f9;--bgM:#f4f6fa;--bgHd:rgba(247,248,251,.96);--bgIn:#fff;--bgTab:#e2e8f0;--bd:#e2e8f0;--bdL:#edf0f4;--bdH:#cbd5e1;--tx:#0f172a;--txS:#475569;--txM:#64748b;--txF:#94a3b8;--txG:#b0bec5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;transition:background .4s,color .4s}
.sb{width:220px;background:#06060e;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sb-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px}
.sb-logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:#fff}
.sb-logo span{font-family:var(--head);font-size:16px;font-weight:700;color:#fff}
.sb-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.4);font-size:13px;border:none;background:transparent;width:100%;text-align:left;font-family:var(--sans)}
.nb:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7)}
.nb.on{color:#fff;font-weight:600}
.nb .ic{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nb .ds{font-size:10px;color:rgba(255,255,255,.2);display:block}
.sb-ft{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06)}
.sb-ft .nb{font-size:12px;padding:8px 12px;color:rgba(255,255,255,.3)}
.mn{margin-left:220px;flex:1;min-height:100vh}
.topbar{padding:12px 28px;border-bottom:1px solid var(--bd);background:var(--bgHd);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.ct{padding:24px 28px;max-width:1100px}
.vw{display:none}.vw.on{display:block}
.st{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px 14px;position:relative;overflow:hidden}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono);white-space:nowrap;font-weight:500}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;transition:all .2s}
.card:hover{border-color:var(--bdH)}
.fbtn{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--mono);border:1px solid var(--bdL);background:transparent;color:var(--txF);transition:all .2s}
.fbtn:hover{border-color:var(--bdH);color:var(--tx)}
.mcard{background:var(--bgM);border:1px solid var(--bd);border-radius:14px;padding:20px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.mcard:hover{transform:translateY(-2px)}
.sect{font-size:11px;color:var(--txS);font-family:var(--mono);letter-spacing:1px;margin-bottom:12px;text-transform:uppercase}
.alrt{flex:1;min-width:200px;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.inp{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--bdH);background:var(--bgIn);color:var(--tx);font-size:13px;font-family:var(--sans);outline:none;box-sizing:border-box}
.inp:focus{border-color:var(--blu)}
@media(max-width:768px){.sb{width:60px}.sb-logo span,.nb span,.nb .ds{display:none}.nb{justify-content:center;padding:11px}.mn{margin-left:60px}.ct{padding:16px}.sb-logo{justify-content:center}}
</style>
</head>

];

var cur="overview",ccF="all",scF="all",mF="all",mExp=null,qrI=[];

function getT(){return localStorage.getItem("ds-th")||"dark"}
function setT(v){document.documentElement.setAttribute("data-theme",v==="light"?"light":"");localStorage.setItem("ds-th",v);document.getElementById("thIc").textContent=v==="dark"?"☀":"☾";document.getElementById("thLb").textContent=v==="dark"?"Modo claro":"Modo escuro";}
function toggleTheme(){setT(getT()==="dark"?"light":"dark")}

function BG(c,t){return '<span class="badge" style="background:'+c+'15;color:'+c+';border:1px solid '+c+'30">'+t+'</span>';}
function ST(l,v,c,ic){return '<div class="st"><div style="font-size:10px;color:var(--txF);font-family:var(--mono);letter-spacing:.5px;margin-bottom:6px">'+l+'</div><div style="font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;color:'+c+'">'+v+'</div><div style="position:absolute;top:12px;right:14px;font-size:20px;opacity:.12">'+ic+'</div></div>';}

function buildNav(){
var h="";
for(var i=0;i<MODS.length;i++){
var m=MODS[i];var on=cur===m.key;
h+='<button class="nb'+(on?" on":"")+'" onclick="go(\''+m.key+'\')" style="'+(on?"background:"+m.color+"15":"")+'"><span class="ic">'+m.icon+'</span><span style="'+(on?"color:"+m.color:"")+'">'+m.label+'</span>'+(m.desc?'<span class="ds">'+m.desc+'</span>':'')+'</button>';
}
document.getElementById("sbnav").innerHTML=h;
}

function go(k){
cur=k;
buildNav();
var views=document.querySelectorAll(".vw");
for(var i=0;i<views.length;i++) views[i].classList.remove("on");
document.getElementById("v"+k.charAt(0).toUpperCase()+k.slice(1)).classList.add("on");
var m;for(var i=0;i<MODS.length;i++){if(MODS[i].key===k){m=MODS[i];break;}}
document.getElementById("topT").textContent=m?m.icon+" "+m.label:"";
doRender();
}

async function fbAll(){
if(!db)return[];
try{var s=await db.ref("properties").once("value");return s.val()?Object.values(s.val()):[];}
catch(e){return[];}
}

function fbListen(){
if(db) db.ref("properties").on("value",function(){
if(cur==="cleancheck"||cur==="overview") doRender();
});
}

async function doRender(){
try{
if(cur==="overview") await rOv();
else if(cur==="properties") rPr();
else if(cur==="diffscan") rSc();
else if(cur==="cleancheck") await rCC();
else if(cur==="maintenance") rMa();
else if(cur==="team") rTe();
}catch(e){console.error("Render error:",e);}
}

// OVERVIEW
async function rOv(){
var el=document.getElementById("vOverview");
var fb=await fbAll();
var h=new Date().getHours();
var gr=h<12?"Bom dia":h<19?"Boa tarde":"Boa noite";
var ds=new Date().toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
var co=0,occ=0;for(var i=0;i<PROPS.length;i++){if(PROPS[i].status==="checkout_today")co++;if(PROPS[i].status==="occupied"||PROPS[i].status==="checkout_today")occ++;}
var oM=0,tc=0;for(var i=0;i<MT.length;i++){if(MT[i].st!=="completed"){oM++;tc+=MT[i].tech||MT[i].sug||0;}}
var fl=0;for(var i=0;i<SCANS.length;i++){if(SCANS[i].st==="flagged")fl++;}
var fR=0,fG=0;for(var i=0;i<fb.length;i++){if(fb[i].status==="red")fR++;if(fb[i].status==="green")fG++;}
var sum=0;for(var i=0;i<PROPS.length;i++)sum+=PROPS[i].score;var av=Math.round(sum/PROPS.length);

var al="";
if(co>0) al+='<div class="alrt" style="background:#f59e0b10;border:1px solid #f59e0b30" onclick="go(\'properties\')"><span style="font-size:20px">◐</span><div><div style="font-size:13px;font-weight:600;color:#f59e0b">'+co+' check-out hoje</div><div style="font-size:11px;color:var(--txF)">Limpeza necessária</div></div></div>';
if(fl>0) al+='<div class="alrt" style="background:#ef444410;border:1px solid #ef444430" onclick="go(\'diffscan\')"><span style="font-size:20px">⚠</span><div><div style="font-size:13px;font-weight:600;color:#ef4444">'+fl+' danos graves</div><div style="font-size:11px;color:var(--txF)">Requer ação</div></div></div>';
if(fR>0) al+='<div class="alrt" style="background:#ef444410;border:1px solid #ef444430" onclick="go(\'cleancheck\')"><span style="font-size:20px">🚦</span><div><div style="font-size:13px;font-weight:600;color:#ef4444">'+fR+' alerta CleanCheck</div><div style="font-size:11px;color:var(--txF)">Não habitável</div></div></div>';

var o='<h1 style="font-family:var(--head);font-size:26px;font-weight:700;margin:0 0 4px">'+gr+', João 👋</h1>';
o+='<p style="font-size:14px;color:var(--txF);margin:0 0 24px">'+ds+'</p>';
if(al) o+='<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">'+al+'</div>';
o+='<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:28px">';
o+=ST("Propriedades",PROPS.length,"#3b82f6","🏠")+ST("Ocupadas",occ,"#22c55e","●")+ST("Score médio",av,av>=90?"#22c55e":"#f59e0b","◐")+ST("CleanCheck",fb.length,"#22c55e","🚦")+ST("Danos graves",fl,fl>0?"#ef4444":"#22c55e","🔍")+ST("Manutenções",oM,"#f59e0b","🔧");
o+='</div>';

o+='<div class="sect">Módulos</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px">';
var mc=[{k:"diffscan",ic:"🔍",t:"DiffScan",s:"Inspeções fotográficas",v:fl+" pendentes",c:"#8b5cf6"},{k:"cleancheck",ic:"🚦",t:"CleanCheck",s:"Semáforos de limpeza",v:fR+" alertas · "+fG+" OK",c:"#22c55e"},{k:"maintenance",ic:"🔧",t:"Manutenção",s:"Ordens de reparação",v:oM+" abertas · "+tc+"€",c:"#f59e0b"}];
for(var i=0;i<mc.length;i++){var m=mc[i];o+='<div class="mcard" onclick="go(\''+m.k+'\')" onmouseover="this.style.borderColor=\''+m.c+'50\'" onmouseout="this.style.borderColor=\'var(--bd)\'"><div style="font-size:28px;margin-bottom:10px">'+m.ic+'</div><div style="font-size:16px;font-weight:600;margin-bottom:2px">'+m.t+'</div><div style="font-size:12px;color:var(--txM);margin-bottom:10px">'+m.s+'</div><div style="font-size:12px;font-family:var(--mono);color:'+m.c+';font-weight:600">'+m.v+'</div><div style="position:absolute;top:-10px;right:-10px;width:60px;height:60px;border-radius:50%;background:'+m.c+'08"></div></div>';}
o+='</div>';

o+='<div class="sect">Pipeline</div><div style="display:flex;flex-direction:column;gap:8px">';
for(var i=0;i<PROPS.length&&i<4;i++){var p=PROPS[i];if(p.status!=="checkout_today"&&p.status!=="occupied")continue;var ps=PS[p.status];
o+='<div class="card" style="cursor:pointer" onclick="go(\'properties\')"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:12px"><div style="width:10px;height:10px;border-radius:50%;background:'+ps.c+'"></div><div><div style="font-size:14px;font-weight:600">'+p.name+'</div><div style="font-size:11px;color:var(--txM)">'+(p.guest||"—")+' · '+(p.checkout||"—")+'</div></div></div><div style="display:flex;gap:6px">'+BG(p.cleaning==="done"?"#22c55e":"#f59e0b","🧹 "+(p.cleaning==="done"?"OK":"Pendente"))+BG(p.inspection==="done"?"#22c55e":"#f59e0b","🔍 "+(p.inspection==="done"?"OK":"Pendente"))+(p.maintenance>0?BG("#ef4444","🔧 "+p.maintenance):"")+'</div></div></div>';}
o+='</div>';
el.innerHTML=o;
}

// PROPERTIES
function rPr(){
var o='<h2 style="font-family:var(--head);font-size:22px;font-weight:700;margin:0 0 20px">Propriedades</h2><div style="display:flex;flex-direction:column;gap:8px">';
for(var i=0;i<PROPS.length;i++){var p=PROPS[i];var ps=PS[p.status];var sc=p.score>=95?"#22c55e":p.score>=85?"#f59e0b":"#ef4444";
o+='<div class="card"><div style="display:flex;align-items:center;gap:16px"><div style="width:44px;height:44px;border-radius:50%;border:3px solid '+sc+';display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:var(--mono);color:'+sc+'">'+p.score+'</div><div style="flex:1"><div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><span style="font-size:15px;font-weight:600">'+p.name+'</span>'+BG(ps.c,ps.l)+'</div><div style="font-size:12px;color:var(--txM)">'+p.address+'</div></div><div style="display:flex;gap:6px">'+BG(p.cleaning==="done"?"#22c55e":"#f59e0b","🧹 "+(p.cleaning==="done"?"Limpo":"Pendente"))+BG(p.inspection==="done"?"#22c55e":"#f59e0b","🔍 "+(p.inspection==="done"?"OK":"Pendente"))+(p.maintenance>0?BG("#ef4444","🔧 "+p.maintenance):"")+'</div></div></div>';}
o+='</div>';document.getElementById("vProperties").innerHTML=o;
}

// DIFFSCAN
function rSc(){
var arr=scF==="all"?SCANS:SCANS.filter(function(r){return r.st===scF;});
var o='<h2 style="font-family:var(--head);font-size:22px;font-weight:700;margin:0 0 20px">🔍 DiffScan</h2>';
var nOk=0,nPe=0,nFl=0;for(var i=0;i<SCANS.length;i++){if(SCANS[i].st==="ok")nOk++;if(SCANS[i].st==="pending")nPe++;if(SCANS[i].st==="flagged")nFl++;}
o+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">'+ST("Total",SCANS.length,"#8b5cf6","📋")+ST("OK",nOk,"#22c55e","✓")+ST("Pendentes",nPe,"#f59e0b","●")+ST("Danos",nFl,"#ef4444","⚠")+'</div>';
o+='<div style="display:flex;gap:6px;margin-bottom:14px">';
var fls=[{k:"all",l:"Todos"},{k:"flagged",l:"Danos"},{k:"pending",l:"Pendentes"},{k:"ok",l:"OK"}];
for(var i=0;i<fls.length;i++){var f=fls[i];o+='<button class="fbtn" onclick="scF=\''+f.k+'\';rSc()" style="'+(scF===f.k?"background:var(--bgTab);color:var(--tx);border-color:var(--bdH)":"")+'">'+f.l+'</button>';}
o+='</div><div style="display:flex;flex-direction:column;gap:8px">';
for(var i=0;i<arr.length;i++){var r=arr[i];var sc=SS[r.st];
o+='<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:'+sc.c+';display:inline-block"></span><span style="font-size:14px;font-weight:600">'+r.prop+'</span>'+BG(sc.c,sc.l)+'</div><span style="font-size:11px;color:var(--txG);font-family:var(--mono)">'+r.id+'</span></div>';
o+='<div style="font-size:12px;color:var(--txM);font-family:var(--mono)">'+r.room+' · '+r.insp+' · '+r.date+' · Match: '+r.match+'%'+(r.ch>0?' · '+r.ch+' alterações':'')+'</div>';
if(r.items.length){o+='<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">';for(var j=0;j<r.items.length;j++){o+='<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#ef444412;color:#ef4444;font-family:var(--mono)">'+r.items[j]+'</span>';}o+='</div>';}
o+='</div>';}
o+='</div>';document.getElementById("vDiffscan").innerHTML=o;
}

// CLEANCHECK
async function rCC(){
var all=await fbAll();
var g=0,y=0,r=0;for(var i=0;i<all.length;i++){if(all[i].status==="green")g++;if(all[i].status==="yellow")y++;if(all[i].status==="red")r++;}
var filtered=ccF==="all"?all:all.filter(function(p){return p.status===ccF;});
filtered.sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});

var o='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="font-family:var(--head);font-size:22px;font-weight:700">🚦 CleanCheck</h2><div style="display:flex;gap:8px"><button onclick="ccExp()" style="padding:8px 16px;border-radius:8px;border:none;background:var(--bgTab);color:var(--tx);font-size:12px;font-weight:600;cursor:pointer">📊 Exportar</button><button onclick="ccQR()" style="padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;font-size:12px;font-weight:600;cursor:pointer">⊞ QR Codes</button></div></div>';
o+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px">'+ST("Pronto e OK",g,"#22c55e","✓")+ST("Observações",y,"#f59e0b","!")+ST("ALERTA!",r,r>0?"#ef4444":"#22c55e","⚠")+ST("Total",all.length,"#3b82f6","◐")+'</div>';
o+='<div style="display:flex;gap:6px;margin-bottom:14px">';
var fls=[{k:"all",l:"Todos",c:null},{k:"red",l:"⚠ ALERTA!",c:"#ef4444"},{k:"yellow",l:"Observações",c:"#f59e0b"},{k:"green",l:"OK",c:"#22c55e"}];
for(var i=0;i<fls.length;i++){var f=fls[i];var on=ccF===f.k;o+='<button class="fbtn" onclick="ccF=\''+f.k+'\';rCC()" style="'+(on?"background:"+(f.c||"#3b82f6")+"18;color:"+(f.c||"#3b82f6")+";border-color:"+(f.c||"#3b82f6")+"40":"")+'">'+f.l+'</button>';}
o+='</div><div id="qrP" style="display:none;margin-bottom:20px"></div>';
o+='<div style="display:flex;flex-direction:column;gap:8px">';
if(!filtered.length) o+='<div style="text-align:center;padding:40px;color:var(--txM)">Sem registos.</div>';
for(var i=0;i<filtered.length;i++){
var p=filtered[i];var s=SEM[p.status]||{c:"#64748b",l:"—",i:"○"};
var tm=new Date(p.timestamp).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
var bc=p.status==="red"?"#ef444430":p.status==="yellow"?"#f59e0b20":"var(--bd)";
o+='<div class="card" style="border-color:'+bc+'"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(p.notes?"10px":"0")+'"><div style="display:flex;align-items:center;gap:10px"><div style="width:14px;height:14px;border-radius:50%;background:'+s.c+';box-shadow:0 0 8px '+s.c+'50"></div><span style="font-size:16px;font-weight:600">'+p.code+'</span>'+BG(s.c,s.i+" "+s.l)+'</div><span style="font-size:11px;color:var(--txF);font-family:var(--mono)">'+tm+'</span></div>';
if(p.notes){var nc=p.status==="red"?"239,68,68":"245,158,11";o+='<div style="background:rgba('+nc+',.04);border:1px solid rgba('+nc+',.12);border-left:3px solid '+s.c+'60;border-radius:10px;padding:10px 14px"><div style="font-size:10px;font-weight:600;color:'+s.c+';font-family:var(--mono);margin-bottom:4px">'+(p.status==="red"?"⚠ OBSERVAÇÕES (ALERTA)":"● OBSERVAÇÕES")+'</div><div style="font-size:13px;line-height:1.5">'+p.notes+'</div></div>';}
o+='</div>';}
o+='</div>';document.getElementById("vCleancheck").innerHTML=o;
}

// QR GENERATOR
function ccQR(){var p=document.getElementById("qrP");if(!p)return;p.style.display=p.style.display==="none"?"block":"none";if(p.style.display==="block")ccQRR();}
function ccQRR(){
var el=document.getElementById("qrP");if(!el)return;
var h='<div class="card" style="margin-bottom:12px"><div style="font-size:14px;font-weight:600;margin-bottom:12px">Gerar QR Codes</div><div style="margin-bottom:14px"><label style="display:block;font-size:11px;font-weight:600;color:var(--txS);margin-bottom:5px;font-family:var(--mono)">URL BASE</label><input id="qrB" class="inp" value="https://trigueiros-cunha.github.io/Saferent-HM/cleancheck.html"><div style="font-size:10px;color:var(--txG);margin-top:4px">QR abrirá: URL?apt=Nome</div></div><div style="display:flex;gap:10px"><input id="qrN" class="inp" placeholder="Nome do apartamento" style="flex:1"><button onclick="ccAQ()" style="padding:10px 20px;border-radius:10px;border:none;background:#22c55e;color:#0f172a;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--head)">+ Adicionar</button></div></div>';
if(qrI.length>0){
h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><span style="font-size:14px;font-weight:600">'+qrI.length+' QR Code'+(qrI.length>1?'s':'')+'</span><button onclick="ccDA()" style="padding:7px 14px;border-radius:8px;border:none;background:var(--bgTab);color:var(--tx);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono)">📥 Download todos</button></div><div id="qrC"></div></div>';
}
el.innerHTML=h;
var ni=document.getElementById("qrN");if(ni)ni.onkeydown=function(e){if(e.key==="Enter")ccAQ();};
if(qrI.length>0){
var cc=document.getElementById("qrC");
for(var i=0;i<qrI.length;i++){
(function(idx,q){
var cd=document.createElement("div");cd.style.cssText="display:flex;align-items:center;gap:16px;padding:12px 0;"+(idx<qrI.length-1?"border-bottom:1px solid var(--bdL)":"");
var qb=document.createElement("div");qb.id="qrc"+idx;qb.style.cssText="background:#fff;padding:6px;border-radius:8px;flex-shrink:0";
var inf=document.createElement("div");inf.style.cssText="flex:1;overflow:hidden";
inf.innerHTML='<div style="font-size:15px;font-weight:700;margin-bottom:3px">'+q.name+'</div><div style="font-size:10px;color:var(--txG);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+q.url+'</div>';
var ac=document.createElement("div");ac.style.cssText="display:flex;flex-direction:column;gap:6px;flex-shrink:0";
var b1=document.createElement("button");b1.textContent="📥 Download";b1.style.cssText="padding:6px 14px;border-radius:8px;border:none;background:#22c55e;color:#0f172a;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--mono)";
b1.onclick=function(){ccDQ(idx,q.name);};
var b2=document.createElement("button");b2.textContent="✕ Remover";b2.style.cssText="padding:6px 14px;border-radius:8px;border:1px solid var(--bdL);background:transparent;color:var(--txM);font-size:11px;cursor:pointer;font-family:var(--mono)";
b2.onclick=function(){qrI.splice(idx,1);ccQRR();};
ac.appendChild(b1);ac.appendChild(b2);cd.appendChild(qb);cd.appendChild(inf);cd.appendChild(ac);cc.appendChild(cd);
try{new QRCode(qb,{text:q.url,width:100,height:100,colorDark:"#0f172a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});}catch(e){}
})(i,qrI[i]);
}
}
}
function ccAQ(){var n=document.getElementById("qrN").value.trim(),b=document.getElementById("qrB").value.trim();if(!n||!b)return;for(var i=0;i<qrI.length;i++){if(qrI[i].name===n)return;}qrI.push({name:n,url:b+"?apt="+encodeURIComponent(n)});document.getElementById("qrN").value="";ccQRR();}
function ccDQ(i,nm){var el=document.querySelector("#qrc"+i);if(!el)return;var cv=el.querySelector("canvas");var im=el.querySelector("img");var a=document.createElement("a");a.download="QR-"+nm+".png";if(cv)a.href=cv.toDataURL("image/png");else if(im)a.href=im.src;else return;a.click();}
function ccDA(){for(var i=0;i<qrI.length;i++){(function(idx){setTimeout(function(){ccDQ(idx,qrI[idx].name);},idx*400);})(i);}}
async function ccExp(){var all=await fbAll();if(!all.length)return;all.sort(function(a,b){return new Date(b.timestamp)-new Date(a.timestamp);});var csv="\uFEFFData,Hora,Apartamento,Estado,Obs\n";for(var i=0;i<all.length;i++){var p=all[i];var d=new Date(p.timestamp);var sl=SEM[p.status];csv+=d.toLocaleDateString("pt-PT")+","+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})+","+p.code+","+(sl?sl.l:p.status)+","+(p.notes||"").replace(/,/g,";")+"\n";}var a=document.createElement("a");a.download="CleanCheck.csv";a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.click();}

// MAINTENANCE
function rMa(){
var op=[],dn=[];for(var i=0;i<MT.length;i++){if(MT[i].st!=="completed")op.push(MT[i]);else dn.push(MT[i]);}
var tE=0;for(var i=0;i<op.length;i++)tE+=op[i].tech||op[i].sug||0;
var tR=0,tED=0;for(var i=0;i<dn.length;i++){tR+=dn[i].real||0;tED+=dn[i].tech||dn[i].sug||0;}
var va=tED>0?Math.round(((tR-tED)/tED)*100):0;
var arr=mF==="all"?MT:MT.filter(function(m){return m.st===mF;});

var o='<h2 style="font-family:var(--head);font-size:22px;font-weight:700;margin:0 0 20px">🔧 Manutenção</h2>';
o+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px">'+ST("Abertas",op.length,"#f59e0b","📋")+ST("Concluídas",dn.length,"#22c55e","✓")+ST("Custo est.",tE+"€","#3b82f6","💰")+ST("Custo real",tR+"€","#22c55e","✓")+ST("Variação",(va>0?"+":"")+va+"%",Math.abs(va)<=10?"#22c55e":"#f59e0b","📊")+'</div>';
o+='<div style="display:flex;gap:6px;margin-bottom:14px">';
var fls=[{k:"all",l:"Todas"},{k:"scheduled",l:"Agendadas",c:"#3b82f6"},{k:"in_progress",l:"Em curso",c:"#f59e0b"},{k:"waiting_parts",l:"Aguarda material",c:"#8b5cf6"},{k:"completed",l:"Concluídas",c:"#22c55e"}];
for(var i=0;i<fls.length;i++){var f=fls[i];var on=mF===f.k;o+='<button class="fbtn" onclick="mF=\''+f.k+'\';rMa()" style="'+(on?"background:"+(f.c||"#3b82f6")+"18;color:"+(f.c||"#3b82f6")+";border-color:"+(f.c||"#3b82f6")+"40":"")+'">'+f.l+'</button>';}
o+='</div><div style="display:flex;flex-direction:column;gap:8px">';
for(var i=0;i<arr.length;i++){
var m=arr[i];var ms=MS[m.st];var mp=MP[m.pri];var cost=m.tech||m.sug||0;var cd=m.real&&m.tech?m.real-m.tech:null;
o+='<div class="card" style="cursor:pointer" onclick="mExp=mExp===\''+m.id+'\'?null:\''+m.id+'\';rMa()">';
o+='<div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="font-size:15px;font-weight:600;margin-bottom:6px">'+m.issue+'</div><div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap">'+BG(ms.c,ms.l)+BG(mp.c,mp.l)+(m.qt?BG("#8b5cf6","📎 Orçamento"):"")+(m.tech===null&&m.st!=="completed"?BG("#64748b","Aguarda est."):"")+'</div><div style="font-size:11px;color:var(--txF);font-family:var(--mono)">'+m.prop+' · '+m.who+' · '+m.src+' · '+m.date+'</div></div>';
o+='<div style="text-align:right;flex-shrink:0;margin-left:16px">';
if(m.st==="completed"&&m.real){o+='<div style="font-size:18px;font-weight:700;color:#22c55e;font-family:var(--mono)">'+m.real+'€</div><div style="font-size:10px;color:var(--txG)">custo real</div>';if(cd!==null)o+='<div style="font-size:10px;font-family:var(--mono);color:'+(cd<=0?"#22c55e":"#ef4444")+'">'+(cd>0?"+":"")+cd+'€</div>';}
else{o+='<div style="font-size:18px;font-weight:700;color:'+(m.tech?"var(--txS)":"var(--txG)")+';font-family:var(--mono)">'+cost+'€</div><div style="font-size:10px;color:var(--txG)">'+(m.tech?"est. técnico":"sugestão")+'</div>';}
o+='</div></div>';
if(mExp===m.id){
o+='<div style="border-top:1px solid var(--bd);margin-top:12px;padding-top:12px"><div style="display:flex;gap:8px;flex-wrap:wrap">';
o+='<div style="flex:1;min-width:140px;background:var(--bgM);border:1px solid var(--bdL);border-radius:10px;padding:12px"><div style="font-size:10px;color:var(--txG);font-family:var(--mono);margin-bottom:6px">① HISTÓRICO</div><div style="font-size:20px;font-weight:700;color:#3b82f6;font-family:var(--mono)">'+m.sug+'€</div></div>';
o+='<div style="flex:1;min-width:140px;background:var(--bgM);border:1px solid '+(m.tech?"#f59e0b20":"var(--bdL)")+';border-radius:10px;padding:12px"><div style="font-size:10px;color:var(--txG);font-family:var(--mono);margin-bottom:6px">② TÉCNICO</div>'+(m.tech?'<div style="font-size:20px;font-weight:700;color:#f59e0b;font-family:var(--mono)">'+m.tech+'€</div>'+(m.note?'<div style="font-size:11px;color:var(--txM);margin-top:4px;font-style:italic">'+m.note+'</div>':''):'<div style="font-size:14px;color:var(--txG);font-style:italic">Aguarda</div>')+'</div>';
o+='<div style="flex:1;min-width:140px;background:var(--bgM);border:1px solid '+(m.real?"#22c55e20":"var(--bdL)")+';border-radius:10px;padding:12px"><div style="font-size:10px;color:var(--txG);font-family:var(--mono);margin-bottom:6px">③ REAL</div>'+(m.real?'<div style="font-size:20px;font-weight:700;color:#22c55e;font-family:var(--mono)">'+m.real+'€</div>':'<div style="font-size:14px;color:var(--txG);font-style:italic">'+(m.st==="completed"?"Por registar":"Após conclusão")+'</div>')+'</div>';
o+='</div></div>';}
o+='</div>';}
o+='</div>';document.getElementById("vMaintenance").innerHTML=o;
}
